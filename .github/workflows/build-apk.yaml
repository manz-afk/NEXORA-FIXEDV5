name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Versi toolchain
        run: |
          flutter --version
          dart --version
          java -version

      # File di repo ter-upload "datar" (lib__core__api.dart, tools__build.sh, dst).
      # Langkah ini mengembalikannya ke folder asli di salinan CI saja.
      # File yang sudah ada di folder aslinya tidak ditimpa.
      - name: Pulihkan struktur folder
        run: |
          shopt -s nullglob
          count=0
          for f in *__*; do
            [ -f "$f" ] || continue
            dest="${f//__//}"
            mkdir -p "$(dirname "$dest")"
            if [ -e "$dest" ]; then
              echo "lewati (sudah ada): $dest"
            else
              mv "$f" "$dest"
              count=$((count + 1))
            fi
          done
          echo "Dipulihkan: $count file"

          # Pastikan tools/build.sh versi lengkap (pakai flutter create).
          if ! grep -q "flutter create" tools/build.sh 2>/dev/null; then
            if [ -f tools__build.sh ]; then
              mkdir -p tools
              cp tools__build.sh tools/build.sh
              echo "tools/build.sh diganti dengan tools__build.sh"
            else
              echo "::error::tools/build.sh versi lengkap tidak ditemukan"
              exit 1
            fi
          fi

          test -f lib/main.dart || { echo "::error::lib/main.dart tidak ditemukan"; exit 1; }
          test -f tools/patch_android.py || { echo "::error::tools/patch_android.py tidak ditemukan"; exit 1; }
          find lib tools -type f | sort

      # Kalau assets/logo.png belum ada di repo, dibuatkan placeholder.
      - name: Pastikan assets/logo.png ada
        run: |
          if [ -f assets/logo.png ]; then
            echo "assets/logo.png sudah ada"
          else
            echo "::warning::assets/logo.png tidak ada di repo, memakai placeholder. Upload logo asli ke assets/logo.png."
            mkdir -p assets
            pip install pillow --break-system-packages >/dev/null 2>&1 || pip install pillow >/dev/null 2>&1
            python3 - <<'PY'
          from PIL import Image, ImageDraw

          img = Image.new("RGBA", (512, 512), (24, 24, 40, 255))
          d = ImageDraw.Draw(img)
          d.ellipse((96, 96, 416, 416), fill=(94, 129, 244, 255))
          d.polygon([(190, 330), (190, 182), (322, 330), (322, 182)], outline=(255, 255, 255, 255), width=22)
          img.save("assets/logo.png")
          PY
          fi

      # Naikkan batas SDK pubspec ke ^3.10.0 (dot-shorthands) di salinan CI.
      - name: Aktifkan dot-shorthands (SDK constraint pubspec >= 3.10)
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          MIN_VERSION = (3, 10, 0)
          NEW_CONSTRAINT = "^3.10.0"


          def version_of(text):
              m = re.search(r"(\d+)\.(\d+)(?:\.(\d+))?", text)
              return tuple(int(g or 0) for g in m.groups()) if m else None


          def bump(path):
              lines = path.read_bytes().decode("utf-8").split("\n")
              in_env = False
              for i, line in enumerate(lines):
                  cr = "\r" if line.endswith("\r") else ""
                  body = line[: len(line) - len(cr)]
                  if re.fullmatch(r"environment\s*:\s*(#.*)?", body):
                      in_env = True
                      continue
                  if not in_env:
                      continue
                  if body and not body[0].isspace() and not body.startswith("#"):
                      break
                  m = re.fullmatch(r"(\s+sdk\s*:\s*)(.*?)(\s+#.*)?", body)
                  if not m:
                      continue
                  prefix, comment = m.group(1), m.group(3) or ""
                  value = m.group(2).strip("'\" ")
                  lower = re.search(r"(?:\^|>=)\s*(\d+)\.(\d+)(?:\.(\d+))?", value)
                  if not lower:
                      return f"dilewati, constraint '{value}' tidak dikenali"
                  current = tuple(int(g or 0) for g in lower.groups())
                  if current >= MIN_VERSION:
                      return f"sudah OK ('{value}')"
                  lines[i] = f"{prefix}{NEW_CONSTRAINT}{comment}{cr}"
                  path.write_bytes("\n".join(lines).encode("utf-8"))
                  return f"diubah '{value}' -> '{NEW_CONSTRAINT}'"
              return "dilewati, environment.sdk tidak ditemukan"


          dart = subprocess.run(["dart", "--version"], capture_output=True, text=True)
          installed = version_of(dart.stdout + dart.stderr)
          if installed is None or installed < MIN_VERSION:
              print(f"::warning::Dart terpasang {installed} (< 3.10), pubspec tidak diubah.")
              raise SystemExit(0)

          for path in [Path("pubspec.yaml")]:
              print(f"{path}: {bump(path)}")
          PY

      # Konflik dependency ML Kit: text_recognition ^0.13.x vs barcode_scanning ^0.13.0.
      - name: Perbaiki konflik google_mlkit_text_recognition
        run: |
          sed -i -E 's/^([[:space:]]*google_mlkit_text_recognition[[:space:]]*:[[:space:]]*)\^?0\.13\.[0-9]+/\1^0.14.0/' pubspec.yaml
          grep -n "google_mlkit\|sdk:" pubspec.yaml

      # Plugin lama (mis. flutter_inappwebview_android) masih memakai
      # proguard-android.txt yang ditolak Gradle baru. Skrip patch dijalankan
      # tepat sebelum "flutter build apk" di dalam tools/build.sh.
      - name: Pasang patch Gradle plugin (proguard)
        run: |
          cat > tools/patch_gradle.sh <<'SH'
          #!/usr/bin/env bash
          PUB="${PUB_CACHE:-$HOME/.pub-cache}"
          echo "== patch proguard di $PUB =="
          grep -rlE --include='build.gradle' --include='build.gradle.kts' "proguard-android\.txt" "$PUB/hosted" 2>/dev/null | while read -r f; do
            echo "patch: $f"
            sed -i "s/proguard-android\.txt/proguard-android-optimize.txt/g" "$f"
          done || true
          exit 0
          SH
          if ! grep -q "patch_gradle.sh" tools/build.sh; then
            sed -i 's|^\([[:space:]]*\)flutter build apk|\1bash "${GITHUB_WORKSPACE}/tools/patch_gradle.sh"\n\1flutter build apk|' tools/build.sh
          fi
          grep -q "patch_gradle.sh" tools/build.sh || { echo "::error::gagal memasang patch di tools/build.sh"; exit 1; }
          grep -n "patch_gradle\|flutter build apk" tools/build.sh

      - name: Terima lisensi Android SDK
        run: yes | flutter doctor --android-licenses >/dev/null 2>&1 || true

      - name: Build APK
        run: bash tools/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Nexvora-APK
          path: dist/*.apk
          if-no-files-found: error