name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pulihkan struktur folder
        run: bash restore.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build APK
        run: NO_WIDGET=1 bash tools/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Nexvora-APK
          path: dist/Nexvora.apk
