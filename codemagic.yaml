workflows:
  nexvora-apk:
    name: Nexvora APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
      vars:
        NO_WIDGET: "1"
    scripts:
      - name: Pulihkan struktur folder
        script: bash restore.sh
      - name: Build APK
        script: NO_WIDGET=1 bash tools/build.sh
    artifacts:
      - dist/Nexvora.apk
